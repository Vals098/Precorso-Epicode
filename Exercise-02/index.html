<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music App registration page</title>
  </head>
  <body>
    <form action=""onsubmit="alert('Form Submitted')">
      <h1>Music On!</h1>
      <div>
        <input type="text" placeholder="Name" />
        <input type="text" placeholder="Surname" />
      </div>
      <div>
        <input type="email" placeholder="Your Email" />
        <input type="number"  placeholder="Phone Number" />
      </div>
      <div>
        <input type="password" placeholder="Choose a Password" />
        <input type="password" placeholder="Confirm Password" />
      </div>
      <div>
        <p>Date of Birth</p>
        <input type="date" />
      </div>
      <fieldset>
      <legend>Check your music preferences:</legend>
      <div>
        <input type="checkbox" />
        <label for="music1"> Pop</label>
        <input type="checkbox" />
        <label for="music2"> Rock</label>
        <input type="checkbox" />
        <label for="music3"> Jazz</label>
      </div>
      <div>
        <input type="checkbox" />
        <label for="music4"> Hip Hop</label>
        <input type="checkbox" />
        <label for="music5"> Blues</label>
        <input type="checkbox" />
        <label for="music6"> Country</label>
      </div>
      <div>
        <input type="checkbox" />
        <label for="music7"> Classical</label>
        <input type="checkbox" />
        <label for="music8"> R&B</label>
        <input type="checkbox" />
        <label for="music9"> Metal</label>
      </div>
      </fieldset>
      <div>
        <input
          type="radio"
          name="terms"
          id="terms"
        />
        <label for="terms">I agree to the Terms and Conditions</label>
      </div>
      <div>
        <button type="submit">SUBMIT</button>
      </div>
    </form>
  </body>
</html>
